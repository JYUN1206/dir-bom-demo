# MySQL 8.0 可选升级环境(升级包 Day 6)。
# 默认流程无需 Docker; 仅当你要把数据落 MySQL 时才用本文件。
# 启动:  docker compose up -d
# 连接:  localhost:3306, 库 bom_db, 用户 root, 密码 bom123456(仅本地开发)
# 停止:  docker compose down
services:
  db:
    image: mysql:8.0
    container_name: bom-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: bom123456
      MYSQL_DATABASE: bom_db
      TZ: Asia/Shanghai
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    ports:
      - '3306:3306'
    volumes:
      - bom_mysql_data:/var/lib/mysql
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h', 'localhost']
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  bom_mysql_data:
